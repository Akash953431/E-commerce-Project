<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to ShopEase.">
  <title>Login | ShopEase</title>
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-brand" href="index.html">Shop<span>Ease</span></a>
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Welcome back</h1>
      <p class="login-intro">Sign in to continue shopping with ShopEase.</p>

      <form id="login-form">
        <div class="login-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
            <button class="password-toggle" id="password-toggle" type="button" aria-pressed="false">Show</button>
          </div>
        </div>

        <button class="login-submit" type="submit">Log in</button>
        <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
      </form>

      <p class="login-demo-note">Demo login page: account authentication is not connected yet.</p>
    </section>
    <a class="login-back" href="index.html">← Back to ShopEase home</a>
  </main>
</body>
</html>
