<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a ShopEase account.">
  <title>Create Account | ShopEase</title>
  <link rel="stylesheet" href="style.css">
  <script src="signup.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-brand" href="index.html">Shop<span>Ease</span></a>
    <section class="login-card" aria-labelledby="signup-title">
      <h1 id="signup-title">Create account</h1>
      <p class="login-intro">Join ShopEase and make shopping simple.</p>

      <form id="signup-form">
        <div class="login-field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="fullName" type="text" placeholder="Enter your name" autocomplete="name" minlength="2" required>
        </div>

        <div class="login-field">
          <label for="signup-email">Email address</label>
          <input id="signup-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="login-field">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
        </div>

        <div class="login-field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirmPassword" type="password" placeholder="Enter password again" autocomplete="new-password" minlength="6" required>
        </div>

        <button class="login-submit" type="submit">Create account</button>
        <p class="login-message" id="signup-message" role="status" aria-live="polite"></p>
      </form>

      <p class="login-switch">Already have an account? <a href="login.html">Log in</a></p>
      <p class="login-demo-note">Demo sign-up only: account details are not saved or sent to a server.</p>
    </section>
    <a class="login-back" href="index.html">← Back to ShopEase home</a>
  </main>
</body>
</html>
